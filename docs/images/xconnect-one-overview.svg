<svg width="1200" height="540" viewBox="0 0 1200 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvas" x1="0" y1="0" x2="1200" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="brandMark" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="binaryHeaderBg" x1="348" y1="112" x2="668" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="gwHeaderBg" x1="816" y1="112" x2="1164" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#6366F1"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#6366F1"/>
    </marker>
  </defs>

  <!-- Outer Card Canvas -->
  <rect x="0" y="0" width="1200" height="540" rx="24" fill="url(#bgCanvas)"/>
  <rect x="1" y="1" width="1198" height="538" rx="23" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Header Strip -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Brand Mark -->
    <rect x="36" y="28" width="40" height="40" rx="12" fill="url(#brandMark)"/>
    <path d="M49 41 L63 55 M63 41 L49 55" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <text x="90" y="47" font-size="24" font-weight="700" fill="#0F172A">XConnect-One</text>
    <text x="90" y="69" font-size="13.5" font-weight="500" fill="#475569">Single-Binary Zero Trust WireGuard Overlay Client</text>

    <!-- Header Pill Badges -->
    <rect x="614" y="33" width="160" height="30" rx="15" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
    <circle cx="632" cy="48" r="4.5" fill="#10B981"/>
    <text x="644" y="52.5" font-size="12" font-weight="600" fill="#0369A1">Embedded Runtime</text>

    <rect x="786" y="33" width="180" height="30" rx="15" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1"/>
    <circle cx="804" cy="48" r="4.5" fill="#0EA5E9"/>
    <text x="816" y="52.5" font-size="12" font-weight="600" fill="#0369A1">Coexists with AI Proxy</text>

    <rect x="978" y="33" width="186" height="30" rx="15" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <circle cx="996" cy="48" r="4.5" fill="#4F46E5"/>
    <text x="1008" y="52.5" font-size="12" font-weight="600" fill="#3730A3">Ed25519 Signed Config</text>

    <line x1="36" y1="92" x2="1164" y2="92" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Left Column: Cross-Platform Endpoints -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="36" y="112" width="272" height="276" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="54" y="137" font-size="11" font-weight="700" letter-spacing="0.8" fill="#64748B">CROSS-PLATFORM ENDPOINTS</text>

    <!-- macOS -->
    <rect x="50" y="150" width="244" height="51" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="50" y="150" width="4" height="51" rx="2" fill="#0EA5E9"/>
    <text x="66" y="171" font-size="13.5" font-weight="700" fill="#0F172A">macOS</text>
    <text x="66" y="189" font-size="11" font-weight="500" fill="#475569">arm64 / amd64 &#183; LaunchDaemon</text>

    <!-- Linux -->
    <rect x="50" y="209" width="244" height="51" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="50" y="209" width="4" height="51" rx="2" fill="#2563EB"/>
    <text x="66" y="230" font-size="13.5" font-weight="700" fill="#0F172A">Linux</text>
    <text x="66" y="248" font-size="11" font-weight="500" fill="#475569">amd64 / arm64 &#183; systemd / .deb / .rpm</text>

    <!-- Docker / Containers -->
    <rect x="50" y="268" width="244" height="51" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="50" y="268" width="4" height="51" rx="2" fill="#0EA5E9"/>
    <text x="66" y="289" font-size="13.5" font-weight="700" fill="#0F172A">Docker / Containers</text>
    <text x="66" y="307" font-size="11" font-weight="500" fill="#475569">Non-systemd &#183; up / up -D</text>

    <!-- Windows -->
    <rect x="50" y="327" width="244" height="51" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="50" y="327" width="4" height="51" rx="2" fill="#2563EB"/>
    <text x="66" y="348" font-size="13.5" font-weight="700" fill="#0F172A">Windows</text>
    <text x="66" y="366" font-size="11" font-weight="500" fill="#475569">amd64 &#183; Wintun + Task Scheduler</text>
  </g>

  <!-- Connector: Endpoints -> XConnect-One Binary -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <line x1="308" y1="250" x2="344" y2="250" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrowSky)"/>
    <text x="326" y="240" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0284C7">TUN</text>
  </g>

  <!-- Center-Left Box: XConnect-One Binary -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="348" y="112" width="320" height="276" rx="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <path d="M364 113 H652 A15 15 0 0 1 667 128 V168 H349 V128 A15 15 0 0 1 364 113 Z" fill="url(#binaryHeaderBg)"/>
    <line x1="348" y1="168" x2="668" y2="168" stroke="#BAE6FD" stroke-width="1"/>

    <text x="368" y="138" font-size="16" font-weight="700" fill="#1E1B4B">XConnect-One Binary</text>
    <text x="368" y="157" font-size="12" font-weight="600" fill="#0284C7">--runtime=embedded (default)</text>

    <!-- Module 1 -->
    <rect x="366" y="180" width="284" height="46" rx="10" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1"/>
    <text x="382" y="200" font-size="13" font-weight="700" fill="#0F172A">Native TUN + Scoped Routes</text>
    <text x="382" y="217" font-size="11" font-weight="500" fill="#475569">No default-route hijack; AI proxy safe</text>

    <!-- Module 2 -->
    <rect x="366" y="234" width="284" height="46" rx="10" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1"/>
    <text x="382" y="254" font-size="13" font-weight="700" fill="#0F172A">In-process wireguard-go (UAPI)</text>
    <text x="382" y="271" font-size="11" font-weight="500" fill="#475569">fd-scoped handle; clean cleanup on exit</text>

    <!-- Module 3 -->
    <rect x="366" y="288" width="284" height="46" rx="10" fill="#F8FAFC" stroke="#BAE6FD" stroke-width="1"/>
    <text x="382" y="308" font-size="13" font-weight="700" fill="#0F172A">Minimal xray-core</text>
    <text x="382" y="325" font-size="11" font-weight="500" fill="#475569">dokodemo-door + VLESS / XHTTP / TLS</text>

    <!-- Green Pill Footer -->
    <rect x="366" y="344" width="284" height="32" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <circle cx="408" cy="360" r="5" fill="#10B981"/>
    <text x="514" y="364.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065F46">Zero External Dependencies</text>
  </g>

  <!-- Center Connector Arrow: XConnect-One -> XConnect-Gateway -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="673" y="208" width="138" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="742" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#1D4ED8">VLESS / XHTTP + TLS</text>

    <line x1="670" y1="250" x2="810" y2="250" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
    <text x="742" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#0F172A">TCP :443</text>
  </g>

  <!-- Right Box: XConnect-Gateway (Linux Server) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="816" y="112" width="348" height="276" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <path d="M832 113 H1148 A15 15 0 0 1 1163 128 V168 H817 V128 A15 15 0 0 1 832 113 Z" fill="url(#gwHeaderBg)"/>
    <line x1="816" y1="168" x2="1164" y2="168" stroke="#E2E8F0" stroke-width="1"/>

    <text x="836" y="138" font-size="16" font-weight="700" fill="#1E1B4B">XConnect-Gateway</text>
    <text x="836" y="157" font-size="12" font-weight="600" fill="#475569">Linux Server Relay</text>

    <!-- Relay Step 1 -->
    <rect x="836" y="182" width="308" height="56" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="852" y="205" font-size="13" font-weight="700" fill="#0F172A">TLS :443 Entry &#8594; Gateway Xray</text>
    <text x="852" y="224" font-size="11" font-weight="500" fill="#475569">Terminates VLESS / XHTTP over HTTPS</text>

    <!-- Relay Step 2 -->
    <rect x="836" y="248" width="308" height="56" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="852" y="271" font-size="13" font-weight="700" fill="#0F172A">127.0.0.1:51820/UDP &#8594; Kernel WireGuard</text>
    <text x="852" y="290" font-size="11" font-weight="500" fill="#475569">Loopback relay; no public WireGuard UDP port</text>

    <!-- Relay Step 3 -->
    <rect x="836" y="314" width="308" height="56" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="852" y="337" font-size="13" font-weight="700" fill="#065F46">Authorized Private Networks &amp; Services</text>
    <text x="852" y="356" font-size="11" font-weight="500" fill="#047857">Scoped overlay peers, VPS &amp; AI workloads</text>
  </g>

  <!-- Control Plane Dashed Connectors -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <line x1="508" y1="432" x2="508" y2="393" stroke="#6366F1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowIndigo)"/>
    <line x1="990" y1="432" x2="990" y2="393" stroke="#6366F1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowIndigo)"/>
    <rect x="634" y="400" width="230" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="749" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#4338CA">Signed Config Sync &amp; State ACK</text>
  </g>

  <!-- Bottom Bar: XConnect Zero Control Plane -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="36" y="432" width="1128" height="84" rx="16" fill="#FFFFFF" stroke="#C7D2FE" stroke-width="1.5"/>

    <text x="58" y="466" font-size="15.5" font-weight="700" fill="#1E1B4B">XConnect Zero Control Plane</text>
    <text x="58" y="489" font-size="12" font-weight="500" fill="#475569">accounts.svc.plus  &#183;  console.svc.plus</text>

    <!-- Flow Pills -->
    <rect x="424" y="454" width="124" height="40" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="486" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730A3">login / join</text>

    <line x1="554" y1="474" x2="574" y2="474" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

    <rect x="582" y="454" width="188" height="40" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="676" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730A3">Ed25519 Signed Config</text>

    <line x1="776" y1="474" x2="796" y2="474" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

    <rect x="804" y="454" width="122" height="40" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="865" y="479" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730A3">sync / ACK</text>

    <line x1="932" y1="474" x2="952" y2="474" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrowSlate)"/>

    <rect x="960" y="454" width="184" height="40" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="1052" y="479" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">status / diagnose / debug</text>
  </g>
</svg>
